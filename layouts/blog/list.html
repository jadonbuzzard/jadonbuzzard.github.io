{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}

{{ with .RegularPages.ByDate.Reverse }}
<ul class="post-list">
  {{ range . }}
    <li>
      <span class="post-date">{{ .Date.Format "Jan 2, 2006" }}</span>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
  {{ end }}
</ul>
{{ end }}
{{ end }}
