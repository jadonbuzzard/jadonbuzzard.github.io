<article class="paper">
  <h3 class="paper-title">
    {{ with .Params.pdf }}<a href="{{ . }}">{{ $.Title }}</a>{{ else }}{{ .Title }}{{ end }}
    {{ with .Params.note }}<span class="paper-note">[{{ . }}]</span>{{ end }}
  </h3>
  {{ if or .Params.coauthors .Params.venue }}
  <p class="paper-meta">
    {{ with .Params.coauthors }}with {{ partial "coauthors.html" . }}{{ end }}
    {{ with .Params.venue }}<span class="venue">{{ . }}</span>{{ end }}
  </p>
  {{ end }}
</article>
